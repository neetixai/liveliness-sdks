name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web + React Native (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web SDK
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Syntax-check Node example
        run: node --check examples/node-quickstart.mjs
      - name: Typecheck React Native SDK
        working-directory: react-native
        run: |
          npm install
          npm run typecheck

  flutter:
    name: Flutter (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze + test
        working-directory: flutter
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  swift:
    name: Swift (SPM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        working-directory: swift
        run: |
          swift build
          swift test

  # NOTE: no Android job. The Kotlin module (android/) is shipped write-only
  # and pre-release: compiling it needs a full Android Gradle Plugin toolchain
  # (JDK 17 + Android SDK + an app shell project), which we deliberately do
  # not maintain here yet. The module's README discloses this; a proper
  # AGP-based job will be added when the Android SDK graduates from
  # pre-release.
