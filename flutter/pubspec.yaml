name: neetix_liveliness
description: >-
  Neetix Liveliness API client for Dart and Flutter: face match, passive and
  active liveliness (PAD), biometric authentication and passport/ID MRZ
  parsing.
version: 0.1.0
homepage: https://neetix.in
repository: https://github.com/neetixai/liveliness-sdks
issue_tracker: https://github.com/neetixai/liveliness-sdks/issues
topics:
  - kyc
  - liveness
  - face-match
  - biometrics

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
